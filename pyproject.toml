[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scientific-tot-retrieval"
version = "0.1.0"
description = "Selective, provenance-preserving access to scientific tip-of-the-tongue data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "hydra-core>=1.3.2,<1.4",
    "omegaconf>=2.3,<2.4",
]

[project.scripts]
scientific-tot = "scientific_tot.hydra_entry:main"

[project.optional-dependencies]
visual = [
    "open-clip-torch>=3.2,<4",
    "qwen-vl-utils>=0.0.14,<0.1",
    "transformers==4.57.6",
    "torch>=2.6,<3",
    "pillow==12.3.0",
    "pypdfium2==5.9.0",
    "faiss-cpu>=1.10,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyterrier>=1.1.2,<2",
    "ir-measures>=0.4,<1",
]
colqwen = [
    "sentence-transformers[image]==6.1.0",
    "transformers==5.15.0",
    "peft==0.19.1",
    "pypdfium2==5.9.0",
    "qdrant-client==1.17.1",
    "pandas>=2.2,<4",
    "pyterrier>=1.1.2,<2",
    "ir-measures>=0.4,<1",
    "pyarrow>=18,<24",
]
colbert = [
    "colbert-ai==0.2.22",
    "transformers==4.57.6",
    "torch>=2.6,<3",
    "faiss-cpu>=1.10,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyterrier>=1.1.2,<2",
    "ir-measures>=0.4,<1",
]
dense = [
    "pypdfium2==5.9.0",
    "faiss-cpu>=1.10,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "ir-measures>=0.4,<1",
    "pyterrier>=1.1.2,<2",
    "sentence-transformers>=5.1,<6",
    "torch>=2.6,<3",
]
parquet = ["pyarrow>=18,<24"]
notebook = ["ipykernel>=6,<8", "nbclient>=0.10,<1", "nbformat>=5,<6"]
pyterrier = [
    "ir-measures>=0.4,<1",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "pyterrier[java]>=1.1.2,<2",
    "jdk4py==25.0.2.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
# All scripts and both notebooks share the default .venv. Extras above remain
# available for library consumers; project users do not need extra flags.
examples = [
    "open-clip-torch>=3.2,<4",
    "qwen-vl-utils>=0.0.14,<0.1",
    "pypdfium2==5.9.0",
    "qdrant-client==1.17.1",
    "pillow==12.3.0",
    "colbert-ai==0.2.22",
    "transformers==4.57.6",
    "faiss-cpu>=1.10,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "ir-measures>=0.4,<1",
    "pyarrow>=18,<24",
    "pyterrier[java]>=1.1.2,<2",
    "jdk4py==25.0.2.1",
    "sentence-transformers>=5.1,<6",
    "torch>=2.6,<3",
    "ipykernel>=6,<8",
    "nbclient>=0.10,<1",
    "nbformat>=5,<6",
    "jupyterlab>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scientific_tot"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "scientific_tot/config"

[tool.hatch.build.targets.sdist]
include = ["src", "config", "tests", "docs", "examples", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not terrier and not dense_live and not colbert_live and not colqwen_live and not visual_live'"
markers = [
    "visual_live: opt-in real OpenCLIP/Qwen embedding downloads and end-to-end page retrieval",
    "colqwen_live: opt-in real ColQwen checkpoint inference and indexing",
    "colbert_live: opt-in pretrained ColBERTv2 download and native indexing/search",
    "live: opt-in network checks against the published dataset",
    "dense_live: opt-in pretrained model download and encoding integration test",
    "terrier: opt-in JVM indexing/evaluation integration tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Dense encoding requires CUDA; use the default PyPI PyTorch distribution.
[tool.uv]
default-groups = ["dev", "examples"]
conflicts = [
    [{ extra = "colqwen" }, { extra = "visual" }],
    [{ extra = "colqwen" }, { extra = "colbert" }],
    [{ extra = "colqwen" }, { extra = "dense" }],
    [{ extra = "colqwen" }, { group = "examples" }],
]
