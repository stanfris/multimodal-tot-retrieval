defaults:
  - local_gpu
  - _self_

# Storage roots and launcher contracts are inherited from local_cpu via local_gpu.
# These are CPU workers, not concurrent GPU model processes.
threads:
  indexing: ${oc.decode:${oc.env:TOT_INDEXING_THREADS,8}}
  encoding: ${oc.decode:${oc.env:TOT_ENCODING_THREADS,8}}
  faiss: ${oc.decode:${oc.env:TOT_FAISS_THREADS,8}}
