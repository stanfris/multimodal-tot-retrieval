defaults:
  - launcher: local_cpu
  - dataset: default
  - split: test
  - representation: fulltext
  - model: bm25
  - stage: prepare
  - evaluation: default
  - _self_
  - experiment: null
  - override hydra/job_logging: disabled

dry_run: false
seed: 42
paths:
  index: null  # Set an existing index for evaluate/search; index creates one in its run.

hydra:
  job:
    chdir: false
  output_subdir: null  # Saved exclusively by the entry point to prevent overwrites.
  run:
    dir: ${launcher.output_root}/${stage.name}/${now:%Y%m%dT%H%M%S%f}
  sweep:
    dir: ${launcher.output_root}/multirun/${now:%Y%m%dT%H%M%S%f}
    subdir: ${hydra.job.num}
  callbacks:
    fresh_output:
      _target_: scientific_tot.hydra_run.FreshOutput
