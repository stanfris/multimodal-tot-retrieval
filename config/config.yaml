defaults:
  - launcher: local_cpu
  - dataset: default
  - split: test
  - representation: fulltext
  - model: bm25
  - stage: prepare
  - retrieval: default
  - evaluation: default
  - _self_
  - experiment: null
  - mode: normal
  - override hydra/job_logging: disabled

dry_run: false
run:
  name: ${model.name}_${representation.name}_c-${split.corpus}_q-${split.queries}
paths:
  index: null  # Input for retrieve; optional persistent destination for index.
  run: null  # Completed retrieve directory consumed by evaluate.

hydra:
  job:
    chdir: false
  output_subdir: null  # Saved exclusively by the entry point to prevent overwrites.
  run:
    dir: ${artifact_dir:}
  sweep:
    dir: ${sweep_dir:}
    subdir: ${artifact_dir:}
  callbacks:
    fresh_output:
      _target_: scientific_tot.hydra_run.FreshOutput
