name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra parquet
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          HF_HUB_OFFLINE: '1'
      - run: uv build
      - run: |
          project_dir="$PWD"
          uv venv /tmp/tot-clean
          uv pip install --python /tmp/tot-clean/bin/python dist/*.whl
          cd /tmp
          HF_HUB_OFFLINE=1 /tmp/tot-clean/bin/python "$project_dir/examples/convert_dataset.py" \
            --local-dir "$project_dir/tests/fixtures/adapter" --domain ACL \
            --output /tmp/tot-clean-example
