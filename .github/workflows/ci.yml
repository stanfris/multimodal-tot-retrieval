name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          HF_HUB_OFFLINE: '1'
      - run: uv build
      - run: |
          project_dir="$PWD"
          uv venv /tmp/tot-clean
          uv pip install --python /tmp/tot-clean/bin/python dist/*.whl
          cd /tmp
          HF_HUB_OFFLINE=1 /tmp/tot-clean/bin/python "$project_dir/examples/convert_dataset.py" \
            --local-dir "$project_dir/tests/fixtures/adapter" --domain ACL \
            --output /tmp/tot-clean-example

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run python -m ipykernel install --sys-prefix --name scientific-tot --display-name "Scientific ToT"
      # Fixture CLI and both execute-all notebooks use the same locked .venv/JDK.
      # Explicit integration tests may download Terrier and pretrained model weights.
      - run: uv run python examples/pyterrier_bm25.py --local-dir tests/fixtures/adapter --domain ACL --output /tmp/tot-bm25
      - run: uv run python examples/dense_retrieval.py --local-dir tests/fixtures/adapter --documents 2 --queries 1 --cache /tmp/tot-dense-cache --output /tmp/tot-dense
      - run: uv run pytest -m 'terrier or dense_live'
