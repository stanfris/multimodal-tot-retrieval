name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --ignore=tests/test_colqwen.py
        env:
          HF_HUB_OFFLINE: '1'
      - run: uv build
      - run: |
          uv venv /tmp/tot-clean
          uv pip install --python /tmp/tot-clean/bin/python dist/*.whl
          cd /tmp
          HF_HUB_OFFLINE=1 /tmp/tot-clean/bin/scientific-tot dry_run=true experiment=dense_fulltext
          HF_HUB_OFFLINE=1 /tmp/tot-clean/bin/python -m scientific_tot.hydra_entry \
            --multirun dry_run=true experiment=bm25_fulltext,dense_fulltext,openclip_pages \
            hydra.sweep.dir=/tmp/tot-clean-sweep

  colqwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --no-default-groups --extra colqwen --group dev
        env:
          UV_PROJECT_ENVIRONMENT: .venv-colqwen
      - run: uv run --locked --no-default-groups --extra colqwen --group dev pytest tests/test_colqwen.py
        env:
          UV_PROJECT_ENVIRONMENT: .venv-colqwen
          HF_HUB_OFFLINE: '1'
